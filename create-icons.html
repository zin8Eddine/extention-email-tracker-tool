<!DOCTYPE html>
<html>
<head>
  <title>Extension Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px;
      display: block;
    }
    .preview {
      display: inline-block;
      margin: 20px;
      text-align: center;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <h1>📧 Extension Icon Generator</h1>
  <p>Click the button below to generate and download all icon sizes for the extension.</p>
  
  <button onclick="generateAllIcons()">Generate All Icons</button>
  
  <div id="previews"></div>
  
  <script>
    function createIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw email icon (@ symbol)
      ctx.fillStyle = 'white';
      ctx.font = `bold ${Math.floor(size * 0.6)}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('@', size / 2, size / 2);
      
      return canvas;
    }
    
    function downloadIcon(canvas, size) {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }
    
    function generateAllIcons() {
      const sizes = [16, 48, 128];
      const previews = document.getElementById('previews');
      previews.innerHTML = '<h2>Preview:</h2>';
      
      sizes.forEach((size, index) => {
        const canvas = createIcon(size);
        
        // Show preview
        const preview = document.createElement('div');
        preview.className = 'preview';
        preview.innerHTML = `
          <canvas width="${size}" height="${size}"></canvas>
          <p>icon${size}.png</p>
        `;
        const previewCanvas = preview.querySelector('canvas');
        previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
        previews.appendChild(preview);
        
        // Download after a delay
        setTimeout(() => {
          downloadIcon(canvas, size);
        }, index * 500);
      });
      
      alert('Icons generated! Check your downloads folder, then move them to the icons/ folder.');
    }
    
    // Auto-generate on load
    window.addEventListener('load', () => {
      setTimeout(generateAllIcons, 500);
    });
  </script>
</body>
</html>
